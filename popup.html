<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="title">SHARIF EDU HIGHLIGHTER</span>
    <div class="header-right">
      <button id="openEduBtn">EDU SITE ↗</button>
      <span class="status"><span class="dot"></span> READY</span>
    </div>
  </div>

  <div class="section">
    <label>TARGET COURSES <span class="badge yellow">YEL</span></label>
    <textarea id="courseCodes" spellcheck="false" placeholder="25411, 25751..."></textarea>
  </div>
  
  <div class="section">
    <label>TARGET PROFESSORS <span class="badge red">RED</span></label>
    <textarea id="professors" spellcheck="false" placeholder="احمدی، کمالی..."></textarea>
  </div>

  <div class="toggles">
    <div class="toggle-row">
      <span class="toggle-label-text">MASTER HIGHLIGHTS</span>
      <label class="toggle-container">
        <input type="checkbox" id="enableHighlights" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label-text">SUMMARY WIDGET</span>
      <label class="toggle-container">
        <input type="checkbox" id="enableWidget" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="actions">
    <button id="saveBtn">APPLY CHANGES</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
